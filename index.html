
<!DOCTYPE html>
<html lang="co">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Carnettu di Missaghji</title>
  <link rel="manifest" href="/missaghji/manifest.json">
  <script>console.log("MANIFEST TEST")</script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="screen">
  <main class="card narrow">
    <h1 class="title">CARNETTU DI MISSAGHJI</h1>
    <div class="lang-switch" role="group" aria-label="Lingua / Langue">
      <button type="button" class="btn sm" data-lang="co">Corsu</button>
      <button type="button" class="btn sm" data-lang="fr">Français</button>
    </div>
    <form id="startForm" novalidate>
      <label for="username" data-i18n="start_name">A voscia casata</label>
      <input id="username" name="username" type="text" autocomplete="off" autocapitalize="characters" placeholder="Asempiu : MURACCIOLI" data-i18n-placeholder="start_placeholder" pattern="^[A-Za-zÀ-ÖØ-öø-ÿ\-\s]+$" required />
      <small class="hint"></small>
      <label for="entity" data-i18n="start_entity">Entità</label>
      <select id="entity" name="entity" required>
        <option value="BAO">BAO</option>
        <option value="BOBA">BOBA</option>
        <option value="BOCC">BOCC</option>
        <option value="BOES">BOES</option>
        <option value="BOGA">BOGA</option>
        <option value="BOGB">BOGB</option>
        <option value="BOPO">BOPO</option>
        <option value="BOVA">BOVA</option>
      </select>
      <button type="submit" class="btn primary" style="margin-top:15px;" data-i18n="start_enter">Entra</button>
    </form>
  </main>
  <script>window.APP_VERSION='v1.6.0';</script>
  <script src="app.js"></script>
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/missaghji/sw.js', { scope: '/missaghji/' })
        .then(reg => console.log('SW enregistré :', reg.scope))
        .catch(err => console.error('SW erreur :', err));
    });
  }
</script>
</body>
</html>
