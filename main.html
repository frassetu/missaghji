<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Carnettu di Missaghji</title>
  <script>try{var m=localStorage.getItem('theme');document.documentElement.dataset.theme=(m==='dark'||(m!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light'}catch(e){}</script>
  <meta name="theme-color" content="#F2F2F2">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Missaghji">
  <link rel="stylesheet" href="style.css" />
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { scope: '/' });
      });
    }
  </script>
</head>
<body class="screen">
  <header id="topbar" class="topbar"></header>
  <div id="content" class="container"></div>
  <div id="menuOverlay" class="overlay hidden">
    <div class="overlay-backdrop" id="overlayBackdrop"></div>
    <aside class="drawer" role="dialog" aria-label="Menu">
      <div class="drawer-header">
        <strong data-i18n="menu_title">Uzzioni</strong>
        <button class="btn ghost sm" id="closeMenu" title="Sarrà" data-i18n-title="menu_close">✕</button>
      </div>
      <div class="drawer-content">
        <button class="btn primary full" id="btnInstall" data-i18n="menu_install">Installà</button>
        <button class="btn full" id="btnHistory" data-i18n="menu_history">Storicu</button>
        <button class="btn ghost full" id="btnChange" data-i18n="menu_change">Scambià l'entità</button>
        <div class="lang-block">
          <div class="small">Lingua · Langue</div>
          <div class="lang-switch" role="group" aria-label="Lingua / Langue">
            <button type="button" class="btn sm" data-lang="co">Corsu</button>
            <button type="button" class="btn sm" data-lang="fr">Français</button>
          </div>
        </div>
        <div class="lang-block">
          <div class="small" data-i18n="theme_label">Tema</div>
          <div class="lang-switch" role="group" aria-label="Tema / Thème">
            <button type="button" class="btn sm" data-theme-set="auto" data-i18n="theme_auto">Auto</button>
            <button type="button" class="btn sm" data-theme-set="light" data-i18n="theme_light">Chjaru</button>
            <button type="button" class="btn sm" data-theme-set="dark" data-i18n="theme_dark">Scuru</button>
          </div>
        </div>
      </div>
    </aside>
  </div>
  <script src="app.js"></script>
</body>
</html>
